theme: oled
default_2fa_method: totp

server:
  address: 'tcp://0.0.0.0:9091/'

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml

password_policy:
  standard:
    enabled: true
    min_length: 12
    max_length: 128
    require_uppercase: true
    require_lowercase: true
    require_number: true
    require_special: true

access_control:
  default_policy: deny
  rules:
    - domain: '{{ env "WEB_URL_AI" }}'
      resources:
        - "^/v1/.*$"     # Bypasses OpenAI-compatible API routes
        - "^/readyz$"    # Bypasses the Docker healthcheck route
      policy: bypass     # Let this traffic through without an Authelia login
    - domain:
        - '*.{{ env "WEB_URL_DOMAIN" }}'
        - '{{ env "WEB_URL" }}'
      policy: one_factor

session:
  name: authelia_session
  expiration: 3600
  inactivity: 600
  cookies:
    - domain: '{{ env "WEB_URL_DOMAIN" }}'
      authelia_url: 'https://{{ env "WEB_URL" }}'

# Configure CrowdSec's acquis.yaml file with Authelia, and enable the plugin to supervise the logs:
# sudo docker exec crowdsec cscli collections install LePresidente/authelia
regulation:
  max_retries: 5
  find_time: 120
  ban_time: 300

storage:
  local:
    path: /config/db.sqlite3

notifier:
  smtp:
    subject: '{title}'

identity_providers:
  oidc:
    cors:
      endpoints:
        - authorization
        - token
        - revocation
        - introspection
        - userinfo
      allowed_origins:
        - 'https://{{ env "WEB_URL_IMMICH" }}'
        - 'https://{{ env "WEB_URL_CALIBRE" }}'
        - 'https://{{ env "WEB_URL_AI" }}'
      allowed_origins_from_client_redirect_uris: true
    jwks:
      ##### GENERATE the RSA key with:
      # cd /mnt/hot/services/authelia/ && sudo openssl genrsa -out private.pem 4096 && sudo chown 1000:1000 private.pem && sudo chmod 600 private.pem
      - key: {{ secret "/config/private.pem" | mindent 10 "|" | msquote }}

    clients:
      ##### GENERATE the hashed client_secret passwords, introduced in the corresponding apps, with:
      # sudo docker run --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --password 'YOUR_APP_SECRET'

      - client_id: 'immich'
        client_name: 'Immich'
        client_secret: '{{ env "SECRET_IMMICH" }}'
        token_endpoint_auth_method: 'client_secret_post'
        public: false
        authorization_policy: one_factor
        consent_mode: implicit
        redirect_uris:
          # Web interface
          - 'https://{{ env "WEB_URL_IMMICH" }}/auth/login'
          - 'https://{{ env "WEB_URL_IMMICH" }}/user-settings'
          # Android/IOS app interface
          - 'app.immich:///oauth-callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
        userinfo_signed_response_alg: 'none'

      - client_id: 'calibre'
        client_name: 'Calibre Web Automated'
        client_secret: '{{ env "SECRET_CALIBRE" }}'
        public: false
        authorization_policy: one_factor
        consent_mode: implicit
        redirect_uris:
          - 'https://{{ env "WEB_URL_CALIBRE" }}/login/generic/authorized'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        userinfo_signed_response_alg: 'none'

      - client_id: 'openwebui'
        client_name: 'Open WebUI'
        client_secret: '{{ env "SECRET_AI" }}'
        public: false
        authorization_policy: one_factor
        consent_mode: implicit
        redirect_uris:
          - 'https://{{ env "WEB_URL_AI" }}/oauth/oidc/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
        userinfo_signed_response_alg: 'none'
