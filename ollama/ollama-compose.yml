services:

  ollama:
    container_name: ollama
    image: ollama/ollama:latest  
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_KEEP_ALIVE=8h
      - OLLAMA_CONTEXT_LENGTH=131072
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ${SERVICE_DIR}/ollama:/root/.ollama
    networks:
      - ai-backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 20G
          cpus: "2.0"

  openwebui:
    container_name: openwebui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - TZ=Europe/Madrid
      - OLLAMA_BASE_URL=http://ollama:11434
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
    env_file:
      - stack.env
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.openwebui.loadbalancer.server.port=8080
      - traefik.http.routers.openwebui.rule=Host(`${WEB_URL_OPENWEBUI}`)
      - traefik.http.routers.openwebui.service=openwebui
      - traefik.http.routers.openwebui.entrypoints=websecure
      - traefik.http.routers.openwebui.tls=true
      - traefik.http.routers.openwebui.tls.certresolver=home
    volumes:
      - ${SERVICE_DIR}/openwebui:/app/backend/data
    networks:
      - proxy
      - ai-backend
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2.0"

networks:
  proxy:
    external: true
  ai-backend:
    external: true
