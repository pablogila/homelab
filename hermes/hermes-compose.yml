services:

  hermes-agent:
    container_name: hermes-agent
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    env_file: stack.env
    environment:
      - TZ=Europe/Madrid
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - HERMES_LLM_TIMEOUT=300
    volumes:
      - ${SERVICE_DIR_HERMES}/data:/home/hermes/.hermes
      - hermes-agent-src:/opt/hermes
    networks:
      - ai-backend
    tty: true
    stdin_open: true
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2.0"

  hermes-webui:
    container_name: hermes-webui
    image: ghcr.io/nesquena/hermes-webui:latest
    restart: unless-stopped
    env_file: stack.env
    depends_on:
      - hermes-agent
    environment:
      - TZ=Europe/Madrid
      - WANTED_UID=${UID:-1000}
      - WANTED_GID=${GID:-1000}
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_GATEWAY_API_KEY=${API_SERVER_KEY}
      - HERMES_API_URL=http://hermes-agent:8642
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.hermes.loadbalancer.server.port=8787
      - traefik.http.routers.hermes.rule=Host(`${WEB_URL_HERMES}`)
      - traefik.http.routers.hermes.service=hermes
      - traefik.http.routers.hermes.entrypoints=websecure
      - traefik.http.routers.hermes.tls=true
      - traefik.http.routers.hermes.tls.certresolver=home
      # Authelia middleware
      - traefik.http.routers.hermes.middlewares=authelia@docker
    volumes:
      - ${SERVICE_DIR_HERMES}/data:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - ${SERVICE_DIR_HERMES}/workspace:/workspace
      - ${READONLY_DIR}:/readonly:ro
    networks:
      - proxy
      - ai-backend
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

volumes:
  hermes-agent-src:

networks:
  proxy:
    external: true
  ai-backend:
    external: true
